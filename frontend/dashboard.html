<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Invoice System - Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <h1>Invoice System</h1>

        <button id="logoutBtn">Logout</button>
      </header>

      <main class="dashboard-content">
        <h2>Dashboard</h2>
        <p>Select an option</p>

        <div class="menu">
          <button class="menu-card" id="inputInvoiceBtn">
            <span>📷</span>
            <strong>Input Invoice</strong>
            <small>Upload invoice picture</small>
          </button>

          <button class="menu-card" id="searchInvoiceBtn">
            <span>🔍</span>
            <strong>Search Invoice</strong>
            <small>Find an invoice</small>
          </button>
        </div>
      </main>
    </div>

    <script src="js/dashboard.js"></script>
  </body>
</html>
